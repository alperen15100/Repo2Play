name: Repo2Play V6

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android repository (owner/repo)"
        required: true
        default: "alperen15100/Nur-widgets"

      branch:
        description: "Branch"
        required: true
        default: "main"

      build_mode:
        description: "NEW = first release / UPDATE = existing app"
        required: true
        type: choice
        options:
          - NEW
          - UPDATE
        default: NEW

jobs:
  build:
    name: Repo2Play V6 Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repo2Play
        uses: actions/checkout@v4

      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find target \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f \
            ! -path "*/build/*" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "❌ Android Gradle project bulunamadi."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "        REPO2PLAY V6"
          echo "======================================"
          echo "Repository : ${{ inputs.repository }}"
          echo "Mode       : ${{ inputs.build_mode }}"
          echo "Project    : $PROJECT_DIR"
          echo "======================================"

      - name: Prepare Gradle engine
        id: gradle
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "gradle_command=./gradlew" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=wrapper" >> "$GITHUB_OUTPUT"
            ./gradlew --version
            exit 0
          fi

          WRAPPER_PROPERTIES=$(find . \
            -path "*/gradle/wrapper/gradle-wrapper.properties" \
            -type f \
            | head -1)

          if [ -n "$WRAPPER_PROPERTIES" ]; then
            DISTRIBUTION_URL=$(grep "^distributionUrl=" \
              "$WRAPPER_PROPERTIES" \
              | cut -d= -f2- \
              | sed 's#\\:#:#g')

            GRADLE_VERSION=$(echo "$DISTRIBUTION_URL" \
              | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')

            if [ -z "$GRADLE_VERSION" ]; then
              echo "❌ Gradle version bulunamadi."
              exit 1
            fi

            curl -L \
              --retry 3 \
              --fail \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            GRADLE_BIN="/tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle"

            chmod +x "$GRADLE_BIN"

            echo "gradle_command=$GRADLE_BIN" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=downloaded" >> "$GITHUB_OUTPUT"

            "$GRADLE_BIN" --version
            exit 0
          fi

          if command -v gradle >/dev/null 2>&1; then
            echo "gradle_command=gradle" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=system" >> "$GITHUB_OUTPUT"
            gradle --version
            exit 0
          fi

          echo "❌ Gradle kullanilamiyor."
          exit 1

      - name: Prepare report
        shell: bash
        run: |
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo "REPO2PLAY V6 - PLAY READINESS REPORT"
            echo "===================================="
            echo ""
            echo "Repository : ${{ inputs.repository }}"
            echo "Branch     : ${{ inputs.branch }}"
            echo "Build mode : ${{ inputs.build_mode }}"
            echo "Gradle     : ${{ steps.gradle.outputs.gradle_mode }}"
            echo ""
          } > "$REPORT"

      - name: Detect and update version
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          echo "======================================"
          echo "VERSION CHECK"
          echo "======================================"

          VERSION_FILE=$(grep -RIl \
            -E 'versionCode[[:space:]=]+[0-9]+' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          OLD_VERSION_CODE=""
          NEW_VERSION_CODE=""

          if [ -n "$VERSION_FILE" ]; then
            OLD_VERSION_CODE=$(grep -Eo \
              'versionCode[[:space:]=]+[0-9]+' \
              "$VERSION_FILE" \
              | head -1 \
              | grep -Eo '[0-9]+' || true)
          fi

          VERSION_NAME_FILE=$(grep -RIl \
            -E 'versionName[[:space:]=]+"[^"]+"' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          OLD_VERSION_NAME=""
          NEW_VERSION_NAME=""

          if [ -n "$VERSION_NAME_FILE" ]; then
            OLD_VERSION_NAME=$(grep -Eo \
              'versionName[[:space:]=]+"[^"]+"' \
              "$VERSION_NAME_FILE" \
              | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ "${{ inputs.build_mode }}" = "UPDATE" ]; then

            echo "UPDATE mode aktif."

            if [ -n "$OLD_VERSION_CODE" ] && [ -n "$VERSION_FILE" ]; then
              NEW_VERSION_CODE=$((OLD_VERSION_CODE + 1))

              sed -i -E \
                "0,/versionCode[[:space:]=]+${OLD_VERSION_CODE}/s//versionCode = ${NEW_VERSION_CODE}/" \
                "$VERSION_FILE"

              echo "✅ versionCode: $OLD_VERSION_CODE -> $NEW_VERSION_CODE"
            else
              echo "⚠ versionCode otomatik bulunamadi."
            fi

            if [ -n "$OLD_VERSION_NAME" ] && [ -n "$VERSION_NAME_FILE" ]; then
              NEW_VERSION_NAME=$(python3 - "$OLD_VERSION_NAME" <<'PY'
import sys

v = sys.argv[1]
parts = v.split(".")

if parts and parts[-1].isdigit():
    parts[-1] = str(int(parts[-1]) + 1)
    print(".".join(parts))
else:
    print(v)
PY
)

              if [ "$NEW_VERSION_NAME" != "$OLD_VERSION_NAME" ]; then
                python3 - "$VERSION_NAME_FILE" "$OLD_VERSION_NAME" "$NEW_VERSION_NAME" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
old = sys.argv[2]
new = sys.argv[3]

text = path.read_text()

text = text.replace(f'versionName = "{old}"', f'versionName = "{new}"', 1)
text = text.replace(f'versionName "{old}"', f'versionName "{new}"', 1)

path.write_text(text)
PY

                echo "✅ versionName: $OLD_VERSION_NAME -> $NEW_VERSION_NAME"
              else
                echo "⚠ versionName otomatik arttirilamadi: $OLD_VERSION_NAME"
              fi
            else
              echo "⚠ versionName otomatik bulunamadi."
            fi

          else
            echo "NEW mode: version bilgisi degistirilmiyor."
          fi

          {
            echo ""
            echo "VERSION"
            echo "======="
            echo "Old versionCode: ${OLD_VERSION_CODE:-not detected}"
            echo "New versionCode: ${NEW_VERSION_CODE:-unchanged}"
            echo "Old versionName: ${OLD_VERSION_NAME:-not detected}"
            echo "New versionName: ${NEW_VERSION_NAME:-unchanged}"
          } >> "$REPORT"

      - name: Analyze Play readiness
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          SCORE=0

          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/src/main/AndroidManifest.xml" \
            -type f \
            | head -1)

          if [ -n "$MANIFEST" ]; then
            echo "✅ AndroidManifest found" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))

            echo "" >> "$REPORT"
            echo "Declared permissions:" >> "$REPORT"

            grep -o 'android.permission.[A-Za-z0-9_]*' \
              "$MANIFEST" \
              | sort -u >> "$REPORT" || true

            echo "" >> "$REPORT"
          else
            echo "⚠ AndroidManifest not detected" | tee -a "$REPORT"
          fi

          if grep -R -q "com.android.application" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts"; then
            echo "✅ Android application plugin" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ Android application plugin not detected" | tee -a "$REPORT"
          fi

          TARGET_SDK=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -n "$TARGET_SDK" ]; then
            echo "✅ Target SDK: $TARGET_SDK" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ Target SDK could not be detected" | tee -a "$REPORT"
          fi

          if ! grep -R -q \
            'android:debuggable="true"' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            echo "✅ No debuggable=true" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ debuggable=true detected" | tee -a "$REPORT"
          fi

          echo "✅ Gradle engine ready" | tee -a "$REPORT"
          SCORE=$((SCORE + 20))

          {
            echo ""
            echo "Initial readiness: $SCORE/100"
          } >> "$REPORT"

      - name: Prepare signing key
        shell: bash
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/repo2play-upload.jks"

          if [ "${{ inputs.build_mode }}" = "UPDATE" ]; then

            if [ -z "${{ secrets.APP_KEYSTORE_BASE64 }}" ]; then
              echo "❌ APP_KEYSTORE_BASE64 secret bulunamadi."
              exit 1
            fi

            printf '%s' "${{ secrets.APP_KEYSTORE_BASE64 }}" \
              | base64 --decode \
              > "$KEYSTORE"

            if [ ! -s "$KEYSTORE" ]; then
              echo "❌ Keystore restore basarisiz."
              exit 1
            fi

          else

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
              -keypass "${{ secrets.SIGNING_KEY_PASSWORD }}" \
              -alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Repo2Play, OU=Android, O=Repo2Play, L=Unknown, S=Unknown, C=US"
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            >/dev/null

          echo "✅ Signing key ready."

      - name: Build Release APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          GRADLE="${{ steps.gradle.outputs.gradle_command }}"

          "$GRADLE" \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Build Release AAB
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          GRADLE="${{ steps.gradle.outputs.gradle_command }}"

          "$GRADLE" \
            bundleRelease \
            --stacktrace \
            --no-daemon

      - name: Locate Release APK
        id: apk
        shell: bash
        run: |
          APK=$(find target \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/androidTest/*" \
            | grep -i release \
            | head -1)

          if [ -z "$APK" ]; then
            echo "❌ Release APK bulunamadi."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "✅ APK: $APK"

      - name: Locate Release AAB
        id: aab
        shell: bash
        run: |
          AAB=$(find target \
            -type f \
            -name "*.aab" \
            ! -path "*/intermediates/*" \
            | grep -i release \
            | head -1)

          if [ -z "$AAB" ]; then
            echo "❌ Release AAB bulunamadi."
            exit 1
          fi

          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "✅ AAB: $AAB"

      - name: Sign and verify APK
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* \
            | sort -V \
            | tail -1)

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" \
            -f \
            -v \
            4 \
            "${{ steps.apk.outputs.apk }}" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/app-release-signed.apk"

      - name: Sign and verify AAB
        shell: bash
        run: |
          cp \
            "${{ steps.aab.outputs.aab }}" \
            "$GITHUB_WORKSPACE/app-release-signed.aab"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -keypass "${{ secrets.SIGNING_KEY_PASSWORD }}" \
            "$GITHUB_WORKSPACE/app-release-signed.aab" \
            "${{ secrets.SIGNING_KEY_ALIAS }}"

          jarsigner \
            -verify \
            "$GITHUB_WORKSPACE/app-release-signed.aab"

      - name: Read final package information
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* \
            | sort -V \
            | tail -1)

          AAPT="$BUILD_TOOLS/aapt"

          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo ""
            echo "FINAL PACKAGE"
            echo "============="
          } >> "$REPORT"

          "$AAPT" dump badging \
            "$GITHUB_WORKSPACE/app-release-signed.apk" \
            | grep -E \
            "^package:|^sdkVersion:|^targetSdkVersion:|^application-label:" \
            >> "$REPORT" || true

      - name: Add signing fingerprint
        shell: bash
        run: |
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo ""
            echo "SIGNING"
            echo "======="
            echo "Mode: ${{ inputs.build_mode }}"
          } >> "$REPORT"

          keytool \
            -list \
            -v \
            -keystore "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            | grep -E "SHA1:|SHA256:" \
            >> "$REPORT" || true

          {
            echo ""
            echo "APK signature: VERIFIED"
            echo "AAB signature: VERIFIED"
          } >> "$REPORT"

      - name: Prepare Repo2Play package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/repo2play-output"

          cp \
            "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/repo2play-output/"

          cp \
            "$GITHUB_WORKSPACE/app-release-signed.aab" \
            "$GITHUB_WORKSPACE/repo2play-output/"

          cp \
            "$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt" \
            "$GITHUB_WORKSPACE/repo2play-output/"

          if [ "${{ inputs.build_mode }}" = "NEW" ]; then

            cp \
              "$GITHUB_WORKSPACE/repo2play-upload.jks" \
              "$GITHUB_WORKSPACE/repo2play-output/"

            {
              echo "REPO2PLAY SIGNING KEY"
              echo "====================="
              echo ""
              echo "Keep repo2play-upload.jks safe."
              echo "Future updates require the same signing key."
              echo ""
              echo "Alias: ${{ secrets.SIGNING_KEY_ALIAS }}"
            } > "$GITHUB_WORKSPACE/repo2play-output/KEYSTORE-INFO.txt"

          else

            {
              echo "REPO2PLAY UPDATE BUILD"
              echo "======================"
              echo ""
              echo "Existing signing key used."
              echo "versionCode/versionName were auto-adjusted when detected."
            } > "$GITHUB_WORKSPACE/repo2play-output/UPDATE-INFO.txt"

          fi

      - name: Upload Repo2Play V6 output
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V6-${{ inputs.build_mode }}-Output
          path: repo2play-output/
          if-no-files-found: error
          retention-days: 7

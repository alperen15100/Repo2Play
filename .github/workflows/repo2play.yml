name: Repo2Play V7.1

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android repository (owner/repo)"
        required: true
        default: "alperen15100/Nur-widgets"

      branch:
        description: "Branch"
        required: true
        default: "main"

      build_mode:
        description: "NEW = first release / UPDATE = existing app"
        required: true
        type: choice
        options:
          - NEW
          - UPDATE
        default: NEW

jobs:
  build:
    name: Repo2Play V7.1 Play Store Doctor
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repo2Play
        uses: actions/checkout@v4


      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find target \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f \
            ! -path "*/build/*" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "          REPO2PLAY V7.1"
          echo "======================================"
          echo "Repository : ${{ inputs.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Mode       : ${{ inputs.build_mode }}"
          echo "Project    : $PROJECT_DIR"
          echo "======================================"


      - name: Prepare Gradle engine
        id: gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "gradle_command=./gradlew" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=wrapper" >> "$GITHUB_OUTPUT"

            ./gradlew --version

            exit 0
          fi

          WRAPPER_PROPERTIES=$(find . \
            -path "*/gradle/wrapper/gradle-wrapper.properties" \
            -type f \
            | head -1)

          if [ -n "$WRAPPER_PROPERTIES" ]; then

            DISTRIBUTION_URL=$(grep "^distributionUrl=" \
              "$WRAPPER_PROPERTIES" \
              | cut -d= -f2- \
              | sed 's#\\:#:#g')

            GRADLE_VERSION=$(echo "$DISTRIBUTION_URL" \
              | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')

            if [ -z "$GRADLE_VERSION" ]; then
              echo "ERROR: Gradle version not detected."
              exit 1
            fi

            echo "Downloading Gradle $GRADLE_VERSION..."

            curl -L \
              --retry 3 \
              --fail \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            rm -rf /tmp/gradle
            mkdir -p /tmp/gradle

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            GRADLE_BIN="/tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle"

            if [ ! -f "$GRADLE_BIN" ]; then
              echo "ERROR: Gradle executable missing."
              exit 1
            fi

            chmod +x "$GRADLE_BIN"

            echo "gradle_command=$GRADLE_BIN" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=downloaded" >> "$GITHUB_OUTPUT"

            "$GRADLE_BIN" --version

            exit 0
          fi

          if command -v gradle >/dev/null 2>&1; then

            echo "gradle_command=gradle" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=system" >> "$GITHUB_OUTPUT"

            gradle --version

            exit 0
          fi

          echo "ERROR: Gradle unavailable."
          exit 1


      - name: Prepare report
        shell: bash
        run: |
          set -e

          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo "REPO2PLAY V7.1 - PLAY STORE DOCTOR"
            echo "=================================="
            echo ""
            echo "Repository : ${{ inputs.repository }}"
            echo "Branch     : ${{ inputs.branch }}"
            echo "Build mode : ${{ inputs.build_mode }}"
            echo "Gradle     : ${{ steps.gradle.outputs.gradle_mode }}"
            echo ""
          } > "$REPORT"


      - name: Detect and update version
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          VERSION_FILE=$(grep -RIl \
            -E 'versionCode[[:space:]=]+[0-9]+' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          OLD_VERSION_CODE=""
          NEW_VERSION_CODE=""

          if [ -n "$VERSION_FILE" ]; then
            OLD_VERSION_CODE=$(grep -Eo \
              'versionCode[[:space:]=]+[0-9]+' \
              "$VERSION_FILE" \
              | head -1 \
              | grep -Eo '[0-9]+' || true)
          fi

          VERSION_NAME_FILE=$(grep -RIl \
            -E 'versionName[[:space:]=]+"[^"]+"' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          OLD_VERSION_NAME=""
          NEW_VERSION_NAME=""

          if [ -n "$VERSION_NAME_FILE" ]; then
            OLD_VERSION_NAME=$(grep -Eo \
              'versionName[[:space:]=]+"[^"]+"' \
              "$VERSION_NAME_FILE" \
              | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ "${{ inputs.build_mode }}" = "UPDATE" ]; then

            if [ -n "$OLD_VERSION_CODE" ] && [ -n "$VERSION_FILE" ]; then

              NEW_VERSION_CODE=$((OLD_VERSION_CODE + 1))

              sed -i -E \
                "0,/versionCode[[:space:]=]+${OLD_VERSION_CODE}/s//versionCode = ${NEW_VERSION_CODE}/" \
                "$VERSION_FILE"

              echo "versionCode: $OLD_VERSION_CODE -> $NEW_VERSION_CODE"

            else

              echo "WARNING: versionCode not detected."

            fi

            if [ -n "$OLD_VERSION_NAME" ] && [ -n "$VERSION_NAME_FILE" ]; then

              NEW_VERSION_NAME=$(python3 -c \
                'import sys; p=sys.argv[1].split("."); p[-1]=str(int(p[-1])+1) if p[-1].isdigit() else p[-1]; print(".".join(p))' \
                "$OLD_VERSION_NAME")

              if [ "$NEW_VERSION_NAME" != "$OLD_VERSION_NAME" ]; then

                sed -i \
                  "0,/versionName = \"${OLD_VERSION_NAME}\"/s//versionName = \"${NEW_VERSION_NAME}\"/" \
                  "$VERSION_NAME_FILE"

                sed -i \
                  "0,/versionName \"${OLD_VERSION_NAME}\"/s//versionName \"${NEW_VERSION_NAME}\"/" \
                  "$VERSION_NAME_FILE"

                echo "versionName: $OLD_VERSION_NAME -> $NEW_VERSION_NAME"

              fi

            else

              echo "WARNING: versionName not detected."

            fi

          else

            echo "NEW mode: version values unchanged."

          fi

          {
            echo "VERSION"
            echo "======="
            echo "Old versionCode: ${OLD_VERSION_CODE:-not detected}"
            echo "New versionCode: ${NEW_VERSION_CODE:-unchanged}"
            echo "Old versionName: ${OLD_VERSION_NAME:-not detected}"
            echo "New versionName: ${NEW_VERSION_NAME:-unchanged}"
            echo ""
          } >> "$REPORT"


      - name: Play Store Doctor scan
        id: doctor
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          SCORE=100
          BLOCKERS=0
          WARNINGS=0
          PASSES=0

          pass_check() {
            echo "PASS    $1" | tee -a "$REPORT"
            PASSES=$((PASSES + 1))
          }

          warn_check() {
            echo "WARNING $1" | tee -a "$REPORT"
            WARNINGS=$((WARNINGS + 1))
            SCORE=$((SCORE - 5))
          }

          block_check() {
            echo "BLOCKER $1" | tee -a "$REPORT"
            BLOCKERS=$((BLOCKERS + 1))
            SCORE=$((SCORE - 15))
          }

          {
            echo "PLAY STORE DOCTOR"
            echo "================="
          } >> "$REPORT"

          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/src/main/AndroidManifest.xml" \
            -type f \
            | head -1)

          if [ -n "$MANIFEST" ]; then
            pass_check "AndroidManifest found"
          else
            block_check "AndroidManifest missing"
          fi

          if grep -R -q "com.android.application" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts"; then

            pass_check "Android application plugin detected"

          else

            block_check "Android application plugin missing"

          fi

          TARGET_SDK=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -z "$TARGET_SDK" ]; then

            block_check "targetSdk not detected"

          elif [ "$TARGET_SDK" -ge 36 ]; then

            pass_check "targetSdk $TARGET_SDK"

          elif [ "$TARGET_SDK" -eq 35 ]; then

            warn_check "targetSdk 35 - API 36 migration recommended for upcoming Google Play requirement"

          else

            block_check "targetSdk $TARGET_SDK is too low"

          fi

          MIN_SDK=$(grep -RhoE \
            'minSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -n "$MIN_SDK" ]; then
            pass_check "minSdk $MIN_SDK detected"
          else
            warn_check "minSdk not detected from source"
          fi

          if grep -R -q \
            'android:debuggable="true"' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then

            block_check "debuggable=true detected"

          else

            pass_check "No explicit debuggable=true"

          fi

          if grep -R -q \
            'android:usesCleartextTraffic="true"' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then

            warn_check "usesCleartextTraffic=true"

          else

            pass_check "No explicit cleartext traffic enablement"

          fi

          if grep -R -q \
            'android:allowBackup="true"' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then

            warn_check "allowBackup=true"

          else

            pass_check "No explicit allowBackup=true"

          fi

          if grep -R -q \
            'android.permission.MANAGE_EXTERNAL_STORAGE' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            warn_check "MANAGE_EXTERNAL_STORAGE permission detected"
          fi

          if grep -R -q \
            'android.permission.REQUEST_INSTALL_PACKAGES' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            warn_check "REQUEST_INSTALL_PACKAGES permission detected"
          fi

          if grep -R -q \
            'android.permission.QUERY_ALL_PACKAGES' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            warn_check "QUERY_ALL_PACKAGES permission detected"
          fi

          if grep -R -q \
            'android.permission.ACCESS_FINE_LOCATION' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            warn_check "Precise location permission detected"
          fi

          if grep -R -q \
            'android.permission.ACCESS_BACKGROUND_LOCATION' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            warn_check "Background location permission detected"
          fi

          if grep -R -q \
            'android.permission.CAMERA' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            warn_check "Camera permission detected"
          fi

          if grep -R -q \
            'android.permission.RECORD_AUDIO' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            warn_check "Microphone permission detected"
          fi

          EXPORTED_COUNT=$(grep -Rho \
            'android:exported="true"' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml" \
            | wc -l)

          if [ "$EXPORTED_COUNT" -gt 0 ]; then
            warn_check "$EXPORTED_COUNT exported component(s) detected"
          else
            pass_check "No explicit exported=true components"
          fi

          ADAPTIVE_ICON=$(find "$PROJECT_DIR" \
            -type f \
            \( \
              -path "*/mipmap-anydpi-v26/ic_launcher.xml" \
              -o \
              -path "*/mipmap-anydpi-v26/ic_launcher_round.xml" \
            \) \
            | head -1)

          if [ -n "$ADAPTIVE_ICON" ]; then
            pass_check "Adaptive launcher icon detected"
          else
            warn_check "Adaptive launcher icon not detected"
          fi

          NATIVE_LIBS=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.so" \
            | head -1)

          if [ -z "$NATIVE_LIBS" ]; then

            pass_check "No bundled native .so libraries detected"

          else

            ARM64=$(find "$PROJECT_DIR" \
              -type f \
              -path "*arm64-v8a*" \
              -name "*.so" \
              | head -1)

            if [ -n "$ARM64" ]; then
              pass_check "arm64-v8a native library detected"
            else
              block_check "Native libraries detected but arm64-v8a not found"
            fi

          fi

          if [ "$SCORE" -lt 0 ]; then
            SCORE=0
          fi

          {
            echo ""
            echo "DOCTOR RESULT"
            echo "============="
            echo "Score: $SCORE/100"
            echo "Passes: $PASSES"
            echo "Blockers: $BLOCKERS"
            echo "Warnings: $WARNINGS"
            echo ""
          } >> "$REPORT"

          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "passes=$PASSES" >> "$GITHUB_OUTPUT"
          echo "blockers=$BLOCKERS" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"


      - name: Prepare signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$GITHUB_WORKSPACE/repo2play-upload.jks"

          if [ "${{ inputs.build_mode }}" = "UPDATE" ]; then

            echo "UPDATE mode: restoring existing signing key."

            if [ -z "$APP_KEYSTORE_BASE64" ]; then
              echo "ERROR: APP_KEYSTORE_BASE64 missing."
              exit 1
            fi

            printf '%s' "$APP_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE"

            if [ ! -s "$KEYSTORE" ]; then
              echo "ERROR: Restored keystore is empty."
              exit 1
            fi

          else

            echo "NEW mode: creating new signing key."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Repo2Play, OU=Android, O=Repo2Play, L=Unknown, S=Unknown, C=US"

          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Signing key ready."


      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.gradle_command }}"

          "$GRADLE" \
            assembleRelease \
            --stacktrace \
            --no-daemon


      - name: Build Release AAB
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.gradle_command }}"

          "$GRADLE" \
            bundleRelease \
            --stacktrace \
            --no-daemon


      - name: Locate Release APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find target \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/androidTest/*" \
            | grep -i release \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo "APK: $APK"


      - name: Locate Release AAB
        id: aab
        shell: bash
        run: |
          set -e

          AAB=$(find target \
            -type f \
            -name "*.aab" \
            ! -path "*/intermediates/*" \
            | grep -i release \
            | head -1)

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

          echo "AAB: $AAB"


      - name: Sign and verify APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          echo "Build Tools: $BUILD_TOOLS"

          "$ZIPALIGN" \
            -f \
            4 \
            "${{ steps.apk.outputs.apk }}" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" verify \
            --verbose \
            "$GITHUB_WORKSPACE/app-release-signed.apk"

          echo "APK signed and verified successfully."


      - name: Sign and verify AAB
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PA

name: Repo2Play V7.2

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android repository (owner/repo)"
        required: true
        default: "alperen15100/Nur-widgets"
      branch:
        description: "Branch"
        required: true
        default: "main"
      build_mode:
        description: "NEW = first release / UPDATE = existing app"
        required: true
        type: choice
        options:
          - NEW
          - UPDATE
        default: NEW

jobs:
  build:
    name: Repo2Play V7.2 Play Store Doctor
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repo2Play
        uses: actions/checkout@v4

      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find target \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f \
            ! -path "*/build/*" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Prepare Gradle
        id: gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
            echo "mode=wrapper" >> "$GITHUB_OUTPUT"

            ./gradlew --version
            exit 0
          fi

          WRAPPER=$(find . \
            -path "*/gradle/wrapper/gradle-wrapper.properties" \
            -type f \
            | head -1)

          if [ -n "$WRAPPER" ]; then
            URL=$(grep '^distributionUrl=' "$WRAPPER" \
              | cut -d= -f2- \
              | sed 's#\\:#:#g')

            VER=$(echo "$URL" \
              | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')

            test -n "$VER"

            curl -L \
              --retry 3 \
              --fail \
              "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" \
              -o /tmp/gradle.zip

            rm -rf /tmp/gradle
            mkdir -p /tmp/gradle

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            CMD="/tmp/gradle/gradle-${VER}/bin/gradle"

            chmod +x "$CMD"

            echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
            echo "mode=downloaded" >> "$GITHUB_OUTPUT"

            "$CMD" --version
            exit 0
          fi

          command -v gradle >/dev/null

          echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          echo "mode=system" >> "$GITHUB_OUTPUT"

          gradle --version

      - name: Prepare report and update version
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo "REPO2PLAY V7.2 - PLAY STORE DOCTOR"
            echo "=================================="
            echo ""
            echo "Repository: ${{ inputs.repository }}"
            echo "Branch: ${{ inputs.branch }}"
            echo "Mode: ${{ inputs.build_mode }}"
            echo "Gradle: ${{ steps.gradle.outputs.mode }}"
            echo ""
          } > "$REPORT"

          VFILE=$(grep -RIl \
            -E 'versionCode[[:space:]]*=?[[:space:]]*[0-9]+' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          NFILE=$(grep -RIl \
            -E 'versionName[[:space:]]*=?[[:space:]]*"[^"]+"' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          OLD_CODE=""
          NEW_CODE=""
          OLD_NAME=""
          NEW_NAME=""

          if [ -n "$VFILE" ]; then
            OLD_CODE=$(grep -Eo \
              'versionCode[[:space:]]*=?[[:space:]]*[0-9]+' \
              "$VFILE" \
              | head -1 \
              | grep -Eo '[0-9]+$' || true)
          fi

          if [ -n "$NFILE" ]; then
            OLD_NAME=$(grep -Eo \
              'versionName[[:space:]]*=?[[:space:]]*"[^"]+"' \
              "$NFILE" \
              | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ "${{ inputs.build_mode }}" = "UPDATE" ]; then

            if [ -n "$OLD_CODE" ] && [ -n "$VFILE" ]; then
              NEW_CODE=$((OLD_CODE + 1))

              sed -i -E \
                "0,/versionCode[[:space:]]*=?[[:space:]]*${OLD_CODE}/s//versionCode = ${NEW_CODE}/" \
                "$VFILE"
            fi

            if [ -n "$OLD_NAME" ] && [ -n "$NFILE" ]; then
              NEW_NAME=$(python3 -c \
                'import sys;p=sys.argv[1].split(".");p[-1]=str(int(p[-1])+1) if p[-1].isdigit() else p[-1];print(".".join(p))' \
                "$OLD_NAME")

              sed -i \
                "0,/versionName = \"${OLD_NAME}\"/s//versionName = \"${NEW_NAME}\"/" \
                "$NFILE"

              sed -i \
                "0,/versionName \"${OLD_NAME}\"/s//versionName \"${NEW_NAME}\"/" \
                "$NFILE"
            fi
          fi

          {
            echo "VERSION"
            echo "======="
            echo "Old versionCode: ${OLD_CODE:-not detected}"
            echo "New versionCode: ${NEW_CODE:-unchanged}"
            echo "Old versionName: ${OLD_NAME:-not detected}"
            echo "New versionName: ${NEW_NAME:-unchanged}"
            echo ""
          } >> "$REPORT"

      - name: Play Store Doctor scan
        id: doctor
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          SCORE=100
          BLOCKERS=0
          WARNINGS=0
          PASSES=0

          pass_check() {
            echo "PASS    $1" | tee -a "$REPORT"
            PASSES=$((PASSES + 1))
          }

          warn_check() {
            echo "WARNING $1" | tee -a "$REPORT"
            WARNINGS=$((WARNINGS + 1))
            SCORE=$((SCORE - 5))
          }

          block_check() {
            echo "BLOCKER $1" | tee -a "$REPORT"
            BLOCKERS=$((BLOCKERS + 1))
            SCORE=$((SCORE - 15))
          }

          echo "PLAY STORE DOCTOR" >> "$REPORT"
          echo "=================" >> "$REPORT"

          MANIFEST=$(find "$PROJECT" \
            -path "*/src/main/AndroidManifest.xml" \
            -type f \
            | head -1)

          if [ -n "$MANIFEST" ]; then
            pass_check "AndroidManifest found"
          else
            block_check "AndroidManifest missing"
          fi

          if grep -R -q "com.android.application" \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts"; then
            pass_check "Android application plugin detected"
          else
            block_check "Android application plugin missing"
          fi

          TARGET=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -z "$TARGET" ]; then
            block_check "targetSdk not detected"
          elif [ "$TARGET" -ge 36 ]; then
            pass_check "targetSdk $TARGET"
          elif [ "$TARGET" -eq 35 ]; then
            warn_check "targetSdk 35; API 36 requirement begins 31 Aug 2026"
          else
            block_check "targetSdk $TARGET is too low"
          fi

          if grep -R -q \
            'android:debuggable="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then
            block_check "debuggable=true detected"
          else
            pass_check "No explicit debuggable=true"
          fi

          if grep -R -q \
            'android:usesCleartextTraffic="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then
            warn_check "usesCleartextTraffic=true"
          else
            pass_check "No explicit cleartext traffic enablement"
          fi

          if grep -R -q \
            'android:allowBackup="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then
            warn_check "allowBackup=true"
          else
            pass_check "No explicit allowBackup=true"
          fi

          if grep -R -q \
            'android.permission.ACCESS_FINE_LOCATION' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then
            warn_check "Precise location permission detected"
          fi

          if grep -R -q \
            'android.permission.MANAGE_EXTERNAL_STORAGE' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then
            warn_check "MANAGE_EXTERNAL_STORAGE detected"
          fi

          EXPORTED=$(grep -Rho \
            'android:exported="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml" \
            | wc -l)

          if [ "$EXPORTED" -gt 0 ]; then
            warn_check "$EXPORTED exported component(s) detected"
          else
            pass_check "No explicit exported=true components"
          fi

          ICON=$(find "$PROJECT" \
            -type f \
            \( \
              -path "*/mipmap-anydpi-v26/ic_launcher.xml" \
              -o \
              -path "*/mipmap-anydpi-v26/ic_launcher_round.xml" \
            \) \
            | head -1)

          if [ -n "$ICON" ]; then
            pass_check "Adaptive launcher icon detected"
          else
            warn_check "Adaptive launcher icon not detected"
          fi

          NATIVE=$(find "$PROJECT" \
            -type f \
            -name "*.so" \
            | head -1)

          if [ -z "$NATIVE" ]; then
            pass_check "No bundled native .so libraries detected"
          else
            ARM64=$(find "$PROJECT" \
              -type f \
              -path "*arm64-v8a*" \
              -name "*.so" \
              | head -1)

            if [ -n "$ARM64" ]; then
              pass_check "arm64-v8a detected"
            else
              block_check "Native libraries found but arm64-v8a missing"
            fi
          fi

          if [ "$SCORE" -lt 0 ]; then
            SCORE=0
          fi

          {
            echo ""
            echo "DOCTOR RESULT"
            echo "============="
            echo "Score: $SCORE/100"
            echo "Passes: $PASSES"
            echo "Blockers: $BLOCKERS"
            echo "Warnings: $WARNINGS"
            echo ""
          } >> "$REPORT"

          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "passes=$PASSES" >> "$GITHUB_OUTPUT"
          echo "blockers=$BLOCKERS" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$GITHUB_WORKSPACE/repo2play-upload.jks"

          if [ "${{ inputs.build_mode }}" = "UPDATE" ]; then
            test -n "$APP_KEYSTORE_BASE64"

            printf '%s' "$APP_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE"

            test -s "$KEYSTORE"
          else
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Repo2Play, OU=Android, O=Repo2Play, L=Unknown, S=Unknown, C=US"
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Signing key ready."

      - name: Build APK and AAB
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.cmd }}"

          "$GRADLE" assembleRelease --stacktrace --no-daemon
          "$GRADLE" bundleRelease --stacktrace --no-daemon

      - name: Locate release outputs
        id: outputs
        shell: bash
        run: |
          set -e

          APK=$(find target \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/androidTest/*" \
            | grep -i release \
            | head -1)

          AAB=$(find target \
            -type f \
            -name "*.aab" \
            ! -path "*/intermediates/*" \
            | grep -i release \
            | head -1)

          test -n "$APK"
          test -n "$AAB"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" \
            -f \
            4 \
            "${{ steps.outputs.outputs.apk }}" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" verify \
            --verbose \
            "$GITHUB_WORKSPACE/app-release-signed.apk"

      - name: Sign AAB
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e

          cp \
            "${{ steps.outputs.outputs.aab }}" \
            "$GITHUB_WORKSPACE/app-release-signed.aab"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$GITHUB_WORKSPACE/app-release-signed.aab" \
            "$KEY_ALIAS"

          jarsigner \
            -verify \
            "$GITHUB_WORKSPACE/app-release-signed.aab"

      - name: Final report
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          AAPT="$BUILD_TOOLS/aapt"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo "FINAL PACKAGE"
            echo "============="
          } >> "$REPORT"

          "$AAPT" dump badging \
            "$GITHUB_WORKSPACE/app-release-signed.apk" \
            | grep -E \
            "^package:|^sdkVersion:|^targetSdkVersion:|^application-label:" \
            >> "$REPORT" || true

          APK_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/app-release-signed.apk")
          AAB_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/app-release-signed.aab")

          {
            echo ""
            echo "APK size bytes: $APK_SIZE"
            echo "AAB size bytes: $AAB_SIZE"
            echo "APK signature: VERIFIED"
            echo "AAB signature: VERIFIED"
            echo ""
            echo "SIGNING FINGERPRINT"
            echo "==================="
          } >> "$REPORT"

          keytool \
            -list \
            -v \
            -keystore "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:" \
            >> "$REPORT" || true

          {
            echo ""
            echo "FINAL VERDICT"
            echo "============="
            echo "Play Readiness Score: ${{ steps.doctor.outputs.score }}/100"
            echo "Passes: ${{ steps.doctor.outputs.passes }}"
            echo "Blockers: ${{ steps.doctor.outputs.blockers }}"
            echo "Warnings: ${{ steps.doctor.outputs.warnings }}"
          } >> "$REPORT"

      - name: Prepare output
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/repo2play-output"

          mkdir -p "$OUTPUT"

          cp \
            "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$OUTPUT/"

          cp \
            "$GITHUB_WORKSPACE/app-release-signed.aab" \
            "$OUTPUT/"

          cp \
            "$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt" \
            "$OUTPUT/"

      - name: Add NEW signing key
        if: "${{ inputs.build_mode == 'NEW' }}"
        shell: bash
        run: |
          set -e

          cp \
            "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            "$GITHUB_WORKSPACE/repo2play-output/repo2play-upload.jks"

      - name: Add UPDATE info
        if: "${{ inputs.build_mode == 'UPDATE' }}"
        shell: bash
        run: |
          set -e

          echo "Existing signing key used." \
            > "$GITHUB_WORKSPACE/repo2play-output/UPDATE-INFO.txt"

          echo "Version values were auto-adjusted when detected." \
            >> "$GITHUB_WORKSPACE/repo2play-output/UPDATE-INFO.txt"

      - name: Verify output
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/repo2play-output"

          ls -lah "$OUTPUT"

          test -f "$OUTPUT/app-release-signed.apk"
          test -f "$OUTPUT/app-release-signed.aab"
          test -f "$OUTPUT/PLAY-READINESS-REPORT.txt"

      - name: Upload Repo2Play output
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V7.2-${{ inputs.build_mode }}-Output
          path: ${{ github.workspace }}/repo2play-output/
          if-no-files-found: error
          retention-days: 7

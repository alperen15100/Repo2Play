name: Repo2Play V2

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android GitHub repository (owner/repo)"
        required: true
        default: "alperen15100/tracear-android"
      branch:
        description: "Branch"
        required: true
        default: "main"

jobs:
  build:
    name: Analyze and Build Android
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repo2Play
        uses: actions/checkout@v4

      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Analyze project
        shell: bash
        run: |
          cd target

          SCORE=0
          REPORT="../REPORT.txt"

          echo "Repo2Play V2 Report" > "$REPORT"
          echo "===================" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "Repository: ${{ inputs.repository }}" >> "$REPORT"
          echo "Branch: ${{ inputs.branch }}" >> "$REPORT"
          echo "" >> "$REPORT"

          if [ -f "gradlew" ]; then
            echo "✓ Gradle Wrapper detected"
            echo "✓ Gradle Wrapper detected" >> "$REPORT"
            SCORE=$((SCORE + 15))
          else
            echo "✗ Gradle Wrapper missing"
            echo "✗ Gradle Wrapper missing" >> "$REPORT"
          fi

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "✓ Gradle settings detected"
            echo "✓ Gradle settings detected" >> "$REPORT"
            SCORE=$((SCORE + 15))
          else
            echo "⚠ Gradle settings not found"
            echo "⚠ Gradle settings not found" >> "$REPORT"
          fi

          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            echo "✓ App module detected"
            echo "✓ App module detected" >> "$REPORT"
            SCORE=$((SCORE + 15))
          else
            echo "⚠ Standard app module not found"
            echo "⚠ Standard app module not found" >> "$REPORT"
          fi

          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            echo "✓ AndroidManifest detected"
            echo "✓ AndroidManifest detected" >> "$REPORT"
            SCORE=$((SCORE + 15))

            echo "" >> "$REPORT"
            echo "Permissions:" >> "$REPORT"
            grep -o 'android.permission.[A-Za-z0-9_]*' \
              app/src/main/AndroidManifest.xml | sort -u >> "$REPORT" || true
          else
            echo "⚠ AndroidManifest not found"
            echo "⚠ AndroidManifest not found" >> "$REPORT"
          fi

          if grep -R -q "com.android.application" . \
            --include="*.gradle" --include="*.gradle.kts"; then
            echo "✓ Android application plugin detected"
            echo "✓ Android application plugin detected" >> "$REPORT"
            SCORE=$((SCORE + 15))
          else
            echo "⚠ Android application plugin not detected"
            echo "⚠ Android application plugin not detected" >> "$REPORT"
          fi

          TARGET_SDK=$(grep -RhoE 'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' . \
            --include="*.gradle" --include="*.gradle.kts" | \
            grep -oE '[0-9]+' | sort -nr | head -1 || true)

          if [ -n "$TARGET_SDK" ]; then
            echo "Target SDK: $TARGET_SDK"
            echo "Target SDK: $TARGET_SDK" >> "$REPORT"

            if [ "$TARGET_SDK" -ge 35 ]; then
              SCORE=$((SCORE + 15))
            fi
          else
            echo "Target SDK: not detected"
            echo "Target SDK: not detected" >> "$REPORT"
          fi

          DEBUGGABLE=$(grep -R "debuggable[[:space:]]*=[[:space:]]*true" . \
            --include="AndroidManifest.xml" | head -1 || true)

          if [ -z "$DEBUGGABLE" ]; then
            echo "✓ No explicit debuggable=true found"
            echo "✓ No explicit debuggable=true found" >> "$REPORT"
            SCORE=$((SCORE + 10))
          else
            echo "⚠ debuggable=true detected"
            echo "⚠ debuggable=true detected" >> "$REPORT"
          fi

          echo "" >> "$REPORT"
          echo "Initial Readiness Score: $SCORE/100" >> "$REPORT"

          echo "READINESS_SCORE=$SCORE" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        working-directory: target
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Release APK
        id: apk
        working-directory: target
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB
        id: aab
        working-directory: target
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Collect final outputs
        shell: bash
        run: |
          mkdir -p repo2play-output

          find target -type f -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/outputs/apk/debug/*" \
            -exec cp {} repo2play-output/ \; || true

          find target -type f -name "*.aab" \
            ! -path "*/intermediates/*" \
            -exec cp {} repo2play-output/ \; || true

          cp REPORT.txt repo2play-output/REPORT.txt

          APK_COUNT=$(find repo2play-output -type f -name "*.apk" | wc -l)
          AAB_COUNT=$(find repo2play-output -type f -name "*.aab" | wc -l)

          {
            echo ""
            echo "Build Results"
            echo "============="
            echo "APK build: ${{ steps.apk.outcome }}"
            echo "AAB build: ${{ steps.aab.outcome }}"
            echo "APK files: $APK_COUNT"
            echo "AAB files: $AAB_COUNT"
          } >> repo2play-output/REPORT.txt

      - name: Upload Repo2Play package
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V2-Output
          path: repo2play-output/
          if-no-files-found: error

name: Repo2Play V10 Clean Engine
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository (owner/repo)"
        required: true
        type: string
      branch:
        description: "Branch"
        required: true
        default: "main"
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: engine
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN || github.token }}
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run engine
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          chmod +x engine/scripts/*.sh
          engine/scripts/run.sh "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/output"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V10-Result
          path: output/
          if-no-files-found: warn
          retention-days: 7

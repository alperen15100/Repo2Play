name: Repo2Play V4

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android GitHub repository (owner/repo)"
        required: true
        default: "alperen15100/Nur-widgets"

      branch:
        description: "Branch"
        required: true
        default: "main"

jobs:
  build:
    name: Repo2Play Signed Android Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repo2Play
        uses: actions/checkout@v4

      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find target \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "❌ Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "✅ Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle engine
        id: gradle
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "gradle_command=./gradlew" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=wrapper" >> "$GITHUB_OUTPUT"
            ./gradlew --version
            exit 0
          fi

          WRAPPER_PROPERTIES=$(find . \
            -path "*/gradle/wrapper/gradle-wrapper.properties" \
            -type f | head -1)

          if [ -n "$WRAPPER_PROPERTIES" ]; then
            DISTRIBUTION_URL=$(grep "^distributionUrl=" \
              "$WRAPPER_PROPERTIES" \
              | cut -d= -f2- \
              | sed 's#\\:#:#g')

            GRADLE_VERSION=$(echo "$DISTRIBUTION_URL" \
              | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')

            if [ -z "$GRADLE_VERSION" ]; then
              echo "❌ Gradle version could not be detected"
              exit 1
            fi

            curl -L \
              --retry 3 \
              --fail \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            GRADLE_BIN="/tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle"

            chmod +x "$GRADLE_BIN"

            echo "gradle_command=$GRADLE_BIN" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=downloaded" >> "$GITHUB_OUTPUT"

            "$GRADLE_BIN" --version
            exit 0
          fi

          if command -v gradle >/dev/null 2>&1; then
            echo "gradle_command=gradle" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=system" >> "$GITHUB_OUTPUT"
            gradle --version
            exit 0
          fi

          echo "❌ Gradle engine unavailable"
          exit 1

      - name: Analyze project
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          SCORE=0

          {
            echo "Repo2Play V4"
            echo "============="
            echo ""
            echo "Repository: ${{ inputs.repository }}"
            echo "Branch: ${{ inputs.branch }}"
            echo "Gradle mode: ${{ steps.gradle.outputs.gradle_mode }}"
            echo ""
          } > "$REPORT"

          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/src/main/AndroidManifest.xml" \
            -type f | head -1)

          if [ -n "$MANIFEST" ]; then
            echo "✅ AndroidManifest" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))

            echo "" >> "$REPORT"
            echo "Permissions:" >> "$REPORT"

            grep -o 'android.permission.[A-Za-z0-9_]*' \
              "$MANIFEST" \
              | sort -u >> "$REPORT" || true
          else
            echo "⚠ AndroidManifest missing" | tee -a "$REPORT"
          fi

          if grep -R -q "com.android.application" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts"; then
            echo "✅ Android application plugin" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ Android application plugin missing" | tee -a "$REPORT"
          fi

          TARGET_SDK=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -n "$TARGET_SDK" ]; then
            echo "✅ Target SDK: $TARGET_SDK" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ Target SDK not detected" | tee -a "$REPORT"
          fi

          if ! grep -R -q \
            'android:debuggable="true"' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml"; then
            echo "✅ No debuggable=true" | tee -a "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ debuggable=true detected" | tee -a "$REPORT"
          fi

          echo "✅ Gradle engine ready" | tee -a "$REPORT"
          SCORE=$((SCORE + 20))

          {
            echo ""
            echo "Initial readiness: $SCORE/100"
          } >> "$REPORT"

      - name: Build unsigned Release APK
        id: apk
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          GRADLE="${{ steps.gradle.outputs.gradle_command }}"
          "$GRADLE" assembleRelease --stacktrace

      - name: Build unsigned Release AAB
        id: aab
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          GRADLE="${{ steps.gradle.outputs.gradle_command }}"
          "$GRADLE" bundleRelease --stacktrace

      - name: Create signing keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -keypass "${{ secrets.SIGNING_KEY_PASSWORD }}" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Repo2Play, OU=Android, O=Repo2Play, L=Unknown, S=Unknown, C=US"

      - name: Find unsigned APK
        id: unsigned_apk
        shell: bash
        run: |
          APK=$(find target \
            -type f \
            -name "*release*.apk" \
            ! -path "*/intermediates/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "❌ Release APK not found"
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "✅ APK found: $APK"

      - name: Sign APK
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f 4 \
            "${{ steps.unsigned_apk.outputs.apk }}" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/app-release-signed.apk"

      - name: Find AAB
        id: unsigned_aab
        shell: bash
        run: |
          AAB=$(find target \
            -type f \
            -name "*release*.aab" \
            ! -path "*/intermediates/*" \
            | head -1)

          if [ -z "$AAB" ]; then
            echo "❌ Release AAB not found"
            exit 1
          fi

          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "✅ AAB found: $AAB"

      - name: Sign AAB
        shell: bash
        run: |
          cp \
            "${{ steps.unsigned_aab.outputs.aab }}" \
            "$GITHUB_WORKSPACE/app-release-signed.aab"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -keypass "${{ secrets.SIGNING_KEY_PASSWORD }}" \
            "$GITHUB_WORKSPACE/app-release-signed.aab" \
            "${{ secrets.SIGNING_KEY_ALIAS }}"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$GITHUB_WORKSPACE/app-release-signed.aab"

      - name: Extract package information
        continue-on-error: true
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT="$BUILD_TOOLS/aapt"

          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo ""
            echo "Package Information"
            echo "==================="
          } >> "$REPORT"

          "$AAPT" dump badging \
            "$GITHUB_WORKSPACE/app-release-signed.apk" \
            | grep -E \
            "^package:|^sdkVersion:|^targetSdkVersion:" \
            >> "$REPORT" || true

      - name: Add signing result to report
        shell: bash
        run: |
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          {
            echo ""
            echo "Signing"
            echo "======="
            echo "APK: signed and verified"
            echo "AAB: signed and verified"
            echo ""
            echo "Build Results"
            echo "============="
            echo "APK Gradle build: ${{ steps.apk.outcome }}"
            echo "AAB Gradle build: ${{ steps.aab.outcome }}"
          } >> "$REPORT"

      - name: Prepare final package
        shell: bash
        run: |
          mkdir -p repo2play-output

          cp \
            "$GITHUB_WORKSPACE/app-release-signed.apk" \
            repo2play-output/

          cp \
            "$GITHUB_WORKSPACE/app-release-signed.aab" \
            repo2play-output/

          cp \
            "$GITHUB_WORKSPACE/repo2play-upload.jks" \
            repo2play-output/

          cp \
            "$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt" \
            repo2play-output/

          {
            echo "IMPORTANT"
            echo "========="
            echo ""
            echo "Keep repo2play-upload.jks safe."
            echo "You will need the same signing key for future updates."
            echo ""
            echo "Alias: ${{ secrets.SIGNING_KEY_ALIAS }}"
          } > repo2play-output/KEYSTORE-INFO.txt

      - name: Upload Repo2Play V4 package
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V4-Output
          path: repo2play-output/
          if-no-files-found: error

name: Repo2Play V2

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android GitHub repository (owner/repo)"
        required: true
        default: "alperen15100/tracear-android"

      branch:
        description: "Branch"
        required: true
        default: "main"

jobs:
  build:
    name: Analyze and Build Android
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1) Repo2Play reposunun kendisini al
      - name: Checkout Repo2Play
        uses: actions/checkout@v4

      # 2) Hedef Android reposunu al
      # Private repo olduğu için TARGET_REPO_TOKEN kullanıyoruz
      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}

      # 3) Java kur
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4) Projeyi temel seviyede analiz et
      - name: Analyze project
        shell: bash
        run: |
          echo "======================================"
          echo "          REPO2PLAY V2"
          echo "======================================"
          echo ""

          REPORT="REPORT.txt"
          SCORE=0

          echo "Repo2Play V2 Report" > "$REPORT"
          echo "===================" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "Repository: ${{ inputs.repository }}" >> "$REPORT"
          echo "Branch: ${{ inputs.branch }}" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "Scanning Android project..."

          # Gradle wrapper var mı?
          GRADLEW=$(find target -type f -name gradlew | head -1)

          if [ -n "$GRADLEW" ]; then
            echo "✓ Gradle Wrapper detected: $GRADLEW"
            echo "✓ Gradle Wrapper detected: $GRADLEW" >> "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "✗ Gradle Wrapper missing"
            echo "✗ Gradle Wrapper missing" >> "$REPORT"
          fi

          # AndroidManifest bul
          MANIFEST=$(find target -type f -path "*/src/main/AndroidManifest.xml" | head -1)

          if [ -n "$MANIFEST" ]; then
            echo "✓ AndroidManifest detected: $MANIFEST"
            echo "✓ AndroidManifest detected: $MANIFEST" >> "$REPORT"
            SCORE=$((SCORE + 20))

            echo "" >> "$REPORT"
            echo "Permissions:" >> "$REPORT"

            grep -o 'android.permission.[A-Za-z0-9_]*' "$MANIFEST" \
              | sort -u >> "$REPORT" || true
          else
            echo "⚠ AndroidManifest not found"
            echo "⚠ AndroidManifest not found" >> "$REPORT"
          fi

          # Android application plugin kontrolü
          if grep -R -q "com.android.application" target \
            --include="*.gradle" --include="*.gradle.kts"; then
            echo "✓ Android application plugin detected"
            echo "✓ Android application plugin detected" >> "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ Android application plugin not detected"
            echo "⚠ Android application plugin not detected" >> "$REPORT"
          fi

          # targetSdk bulmaya çalış
          TARGET_SDK=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            target \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -n "$TARGET_SDK" ]; then
            echo "Target SDK: $TARGET_SDK"
            echo "Target SDK: $TARGET_SDK" >> "$REPORT"

            if [ "$TARGET_SDK" -ge 35 ]; then
              SCORE=$((SCORE + 20))
            fi
          else
            echo "Target SDK: not detected"
            echo "Target SDK: not detected" >> "$REPORT"
          fi

          # Debuggable true var mı?
          DEBUGGABLE=$(grep -R \
            'android:debuggable="true"' \
            target \
            --include="AndroidManifest.xml" \
            | head -1 || true)

          if [ -z "$DEBUGGABLE" ]; then
            echo "✓ No explicit debuggable=true found"
            echo "✓ No explicit debuggable=true found" >> "$REPORT"
            SCORE=$((SCORE + 20))
          else
            echo "⚠ debuggable=true detected"
            echo "⚠ debuggable=true detected" >> "$REPORT"
          fi

          echo "" >> "$REPORT"
          echo "Initial Readiness Score: $SCORE/100" >> "$REPORT"

          echo "READINESS_SCORE=$SCORE" >> "$GITHUB_ENV"

      # 5) gradlew hangi klasördeyse otomatik bul
      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          echo "Searching for gradlew..."

          GRADLEW=$(find target -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "❌ gradlew bulunamadı"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "✓ Gradle project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLEW"

          cd "$PROJECT_DIR"
          ./gradlew --version

      # 6) APK build et
      - name: Build Release APK
        id: apk
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.gradle.outputs.project_dir }}"

          echo "Building Release APK..."

          ./gradlew assembleRelease --stacktrace

      # 7) AAB build et
      - name: Build Release AAB
        id: aab
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.gradle.outputs.project_dir }}"

          echo "Building Release AAB..."

          ./gradlew bundleRelease --stacktrace

      # 8) Çıkan APK ve AAB dosyalarını topla
      - name: Collect final outputs
        shell: bash
        run: |
          mkdir -p repo2play-output

          echo "Searching APK files..."

          find target \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/debug/*" \
            -print

          find target \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/debug/*" \
            -exec cp {} repo2play-output/ \; || true

          echo ""
          echo "Searching AAB files..."

          find target \
            -type f \
            -name "*.aab" \
            ! -path "*/intermediates/*" \
            -print

          find target \
            -type f \
            -name "*.aab" \
            ! -path "*/intermediates/*" \
            -exec cp {} repo2play-output/ \; || true

          cp REPORT.txt repo2play-output/REPORT.txt

          APK_COUNT=$(find repo2play-output -type f -name "*.apk" | wc -l)
          AAB_COUNT=$(find repo2play-output -type f -name "*.aab" | wc -l)

          {
            echo ""
            echo "Build Results"
            echo "============="
            echo "APK build result: ${{ steps.apk.outcome }}"
            echo "AAB build result: ${{ steps.aab.outcome }}"
            echo "APK files found: $APK_COUNT"
            echo "AAB files found: $AAB_COUNT"
          } >> repo2play-output/REPORT.txt

      # 9) Artifact olarak GitHub'dan indirilebilir yap
      - name: Upload Repo2Play package
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V2-Output
          path: repo2play-output/
          if-no-files-found: error

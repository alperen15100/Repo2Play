name: Repo2Play V8

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android repository (owner/repo)"
        required: true
        default: "alperen15100/Nur-widgets"

      branch:
        description: "Branch"
        required: true
        default: "main"

      build_mode:
        description: "NEW = first release / UPDATE = existing app"
        required: true
        type: choice
        options:
          - NEW
          - UPDATE
        default: NEW

      auto_fix:
        description: "Try safe automatic fixes"
        required: true
        type: choice
        options:
          - "YES"
          - "NO"
        default: "YES"

jobs:
  build:
    name: Repo2Play V8 Auto-Fix Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1 - REPO2PLAY
      # ============================================================

      - name: Checkout Repo2Play
        uses: actions/checkout@v4


      # ============================================================
      # 2 - TARGET REPOSITORY
      # ============================================================

      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}


      # ============================================================
      # 3 - JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4 - FIND ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find target \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f \
            ! -path "*/build/*" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "          REPO2PLAY V8"
          echo "======================================"
          echo "Repository : ${{ inputs.repository }}"
          echo "Branch     : ${{ inputs.branch }}"
          echo "Mode       : ${{ inputs.build_mode }}"
          echo "Auto Fix   : ${{ inputs.auto_fix }}"
          echo "Project    : $PROJECT_DIR"
          echo "======================================"


      # ============================================================
      # 5 - GRADLE
      # ============================================================

      - name: Prepare Gradle
        id: gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
            echo "mode=wrapper" >> "$GITHUB_OUTPUT"

            ./gradlew --version

            exit 0
          fi

          WRAPPER=$(find . \
            -path "*/gradle/wrapper/gradle-wrapper.properties" \
            -type f \
            | head -1)

          if [ -n "$WRAPPER" ]; then

            URL=$(grep '^distributionUrl=' "$WRAPPER" \
              | cut -d= -f2- \
              | sed 's#\\:#:#g')

            VER=$(echo "$URL" \
              | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')

            if [ -z "$VER" ]; then
              echo "ERROR: Gradle version could not be detected."
              exit 1
            fi

            echo "Downloading Gradle $VER..."

            curl -L \
              --retry 3 \
              --fail \
              "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" \
              -o /tmp/gradle.zip

            rm -rf /tmp/gradle
            mkdir -p /tmp/gradle

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            CMD="/tmp/gradle/gradle-${VER}/bin/gradle"

            chmod +x "$CMD"

            echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
            echo "mode=downloaded" >> "$GITHUB_OUTPUT"

            "$CMD" --version

            exit 0
          fi

          if command -v gradle >/dev/null 2>&1; then

            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
            echo "mode=system" >> "$GITHUB_OUTPUT"

            gradle --version

            exit 0
          fi

          echo "ERROR: Gradle unavailable."
          exit 1


      # ============================================================
      # 6 - INITIAL REPORT
      # ============================================================

      - name: Prepare reports
        shell: bash
        run: |
          set -e

          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"
          FIXLOG="$GITHUB_WORKSPACE/AUTO-FIX-REPORT.txt"

          {
            echo "REPO2PLAY V8 - PLAY STORE DOCTOR"
            echo "================================"
            echo ""
            echo "Repository : ${{ inputs.repository }}"
            echo "Branch     : ${{ inputs.branch }}"
            echo "Build mode : ${{ inputs.build_mode }}"
            echo "Auto Fix   : ${{ inputs.auto_fix }}"
            echo "Gradle     : ${{ steps.gradle.outputs.mode }}"
            echo ""
          } > "$REPORT"

          {
            echo "REPO2PLAY V8 - AUTO FIX REPORT"
            echo "=============================="
            echo ""
          } > "$FIXLOG"


      # ============================================================
      # 7 - UPDATE VERSION
      # ============================================================

      - name: Detect and update version
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          VFILE=$(grep -RIl \
            -E 'versionCode[[:space:]]*=?[[:space:]]*[0-9]+' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          NFILE=$(grep -RIl \
            -E 'versionName[[:space:]]*=?[[:space:]]*"[^"]+"' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -1 || true)

          OLD_CODE=""
          NEW_CODE=""
          OLD_NAME=""
          NEW_NAME=""

          if [ -n "$VFILE" ]; then

            OLD_CODE=$(grep -Eo \
              'versionCode[[:space:]]*=?[[:space:]]*[0-9]+' \
              "$VFILE" \
              | head -1 \
              | grep -Eo '[0-9]+$' || true)

          fi

          if [ -n "$NFILE" ]; then

            OLD_NAME=$(grep -Eo \
              'versionName[[:space:]]*=?[[:space:]]*"[^"]+"' \
              "$NFILE" \
              | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/' || true)

          fi

          if [ "${{ inputs.build_mode }}" = "UPDATE" ]; then

            if [ -n "$OLD_CODE" ] && [ -n "$VFILE" ]; then

              NEW_CODE=$((OLD_CODE + 1))

              sed -i -E \
                "0,/versionCode[[:space:]]*=?[[:space:]]*${OLD_CODE}/s//versionCode = ${NEW_CODE}/" \
                "$VFILE"

              echo "versionCode $OLD_CODE -> $NEW_CODE"

            fi

            if [ -n "$OLD_NAME" ] && [ -n "$NFILE" ]; then

              NEW_NAME=$(python3 -c \
                'import sys;p=sys.argv[1].split(".");p[-1]=str(int(p[-1])+1) if p[-1].isdigit() else p[-1];print(".".join(p))' \
                "$OLD_NAME")

              sed -i \
                "0,/versionName = \"${OLD_NAME}\"/s//versionName = \"${NEW_NAME}\"/" \
                "$NFILE"

              sed -i \
                "0,/versionName \"${OLD_NAME}\"/s//versionName \"${NEW_NAME}\"/" \
                "$NFILE"

              echo "versionName $OLD_NAME -> $NEW_NAME"

            fi

          fi

          {
            echo "VERSION"
            echo "======="
            echo "Old versionCode: ${OLD_CODE:-not detected}"
            echo "New versionCode: ${NEW_CODE:-unchanged}"
            echo "Old versionName: ${OLD_NAME:-not detected}"
            echo "New versionName: ${NEW_NAME:-unchanged}"
            echo ""
          } >> "$REPORT"


      # ============================================================
      # 8 - BACKUP AFTER VERSION UPDATE
      # ============================================================

      - name: Create Auto-Fix rollback backup
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          rm -rf /tmp/repo2play-project-backup
          mkdir -p /tmp/repo2play-project-backup

          cp -a "$PROJECT/." /tmp/repo2play-project-backup/

          echo "Rollback backup ready."


      # ============================================================
      # 9 - PRE FIX DOCTOR
      # ============================================================

      - name: Pre-Fix Doctor
        id: predoctor
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          TARGET=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          COMPILE=$(grep -RhoE \
            'compileSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          {
            echo "PRE-FIX"
            echo "======="
            echo "targetSdk: ${TARGET:-not detected}"
            echo "compileSdk: ${COMPILE:-not detected}"
            echo ""
          } >> "$REPORT"

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "compile=$COMPILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 10 - SAFE AUTO FIX API 36
      # ============================================================

      - name: Attempt safe API 36 Auto-Fix
        if: ${{ inputs.auto_fix == 'YES' }}
        id: autofix
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"
          FIXLOG="$GITHUB_WORKSPACE/AUTO-FIX-REPORT.txt"

          TARGET="${{ steps.predoctor.outputs.target }}"
          COMPILE="${{ steps.predoctor.outputs.compile }}"

          FIX_ATTEMPTED="NO"

          if [ "$TARGET" = "35" ]; then

            FIX_ATTEMPTED="YES"

            echo "Attempting targetSdk 35 -> 36" | tee -a "$FIXLOG"

            FILES=$(grep -RIl \
              -E 'targetSdk(Versi(on)?)?[[:space:]=("]*35' \
              "$PROJECT" \
              --include="*.gradle" \
              --include="*.gradle.kts" || true)

            for FILE in $FILES; do

              sed -i -E \
                's/(targetSdk(Versi(on)?)?[[:space:]]*=?[[:space:]]*)35/\136/g' \
                "$FILE"

            done

          fi

          if [ "$COMPILE" = "35" ]; then

            FIX_ATTEMPTED="YES"

            echo "Attempting compileSdk 35 -> 36" | tee -a "$FIXLOG"

            FILES=$(grep -RIl \
              -E 'compileSdk(Versi(on)?)?[[:space:]=("]*35' \
              "$PROJECT" \
              --include="*.gradle" \
              --include="*.gradle.kts" || true)

            for FILE in $FILES; do

              sed -i -E \
                's/(compileSdk(Versi(on)?)?[[:space:]]*=?[[:space:]]*)35/\136/g' \
                "$FILE"

            done

          fi

          echo "attempted=$FIX_ATTEMPTED" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11 - TEST AUTO FIX
      # ============================================================

      - name: Test Auto-Fix build
        if: ${{ inputs.auto_fix == 'YES' && steps.autofix.outputs.attempted == 'YES' }}
        id: fixtest
        continue-on-error: true
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.cmd }}"

          "$GRADLE" \
            assembleRelease \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 12 - KEEP OR ROLLBACK AUTO FIX
      # ============================================================

      - name: Resolve Auto-Fix result
        if: ${{ inputs.auto_fix == 'YES' && steps.autofix.outputs.attempted == 'YES' }}
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"
          FIXLOG="$GITHUB_WORKSPACE/AUTO-FIX-REPORT.txt"

          if [ "${{ steps.fixtest.outcome }}" = "success" ]; then

            echo "AUTO-FIX RESULT: SUCCESS" | tee -a "$FIXLOG"
            echo "API 36 changes kept." | tee -a "$FIXLOG"

          else

            echo "AUTO-FIX RESULT: ROLLBACK" | tee -a "$FIXLOG"
            echo "API 36 test build failed." | tee -a "$FIXLOG"
            echo "Restoring original project configuration." | tee -a "$FIXLOG"

            find "$PROJECT" \
              -mindepth 1 \
              -maxdepth 1 \
              -exec rm -rf {} +

            cp -a /tmp/repo2play-project-backup/. "$PROJECT/"

          fi


      # ============================================================
      # 13 - LINT
      # ============================================================

      - name: Run release lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.cmd }}"

          "$GRADLE" \
            lintRelease \
            --no-daemon \
            > "$GITHUB_WORKSPACE/LINT-REPORT.txt" \
            2>&1

          cat "$GITHUB_WORKSPACE/LINT-REPORT.txt"


      # ============================================================
      # 14 - FINAL DOCTOR
      # ============================================================

      - name: Final Play Store Doctor
        id: doctor
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"
          REPORT="$GITHUB_WORKSPACE/PLAY-READINESS-REPORT.txt"

          SCORE=100
          BLOCKERS=0
          WARNINGS=0
          PASSES=0

          pass_check() {
            echo "PASS    $1" | tee -a "$REPORT"
            PASSES=$((PASSES + 1))
          }

          warn_check() {
            echo "WARNING $1" | tee -a "$REPORT"
            WARNINGS=$((WARNINGS + 1))
            SCORE=$((SCORE - 5))
          }

          block_check() {
            echo "BLOCKER $1" | tee -a "$REPORT"
            BLOCKERS=$((BLOCKERS + 1))
            SCORE=$((SCORE - 15))
          }

          {
            echo "FINAL PLAY STORE DOCTOR"
            echo "======================="
          } >> "$REPORT"

          MANIFEST=$(find "$PROJECT" \
            -path "*/src/main/AndroidManifest.xml" \
            -type f \
            | head -1)

          if [ -n "$MANIFEST" ]; then
            pass_check "AndroidManifest found"
          else
            block_check "AndroidManifest missing"
          fi

          TARGET=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -z "$TARGET" ]; then

            block_check "targetSdk not detected"

          elif [ "$TARGET" -ge 36 ]; then

            pass_check "targetSdk $TARGET"

          elif [ "$TARGET" -eq 35 ]; then

            warn_check "targetSdk 35"

          else

            block_check "targetSdk $TARGET too low"

          fi

          COMPILE=$(grep -RhoE \
            'compileSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -n "$COMPILE" ]; then
            pass_check "compileSdk $COMPILE"
          else
            warn_check "compileSdk not detected"
          fi

          if grep -R -q \
            'android:debuggable="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then

            block_check "debuggable=true"

          else

            pass_check "No explicit debuggable=true"

          fi

          if grep -R -q \
            'android:usesCleartextTraffic="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then

            warn_check "Cleartext traffic enabled"

          else

            pass_check "Cleartext traffic not explicitly enabled"

          fi

          if grep -R -q \
            'android:allowBackup="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then

            warn_check "allowBackup=true"

          else

            pass_check "allowBackup=true not detected"

          fi

          if grep -R -q \
            'android.permission.ACCESS_FINE_LOCATION' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then

            warn_check "Precise location permission"

          fi

          if grep -R -q \
            'android.permission.ACCESS_BACKGROUND_LOCATION' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then

            warn_check "Background location permission"

          fi

          if grep -R -q \
            'android.permission.MANAGE_EXTERNAL_STORAGE' \
            "$PROJECT" \
            --include="AndroidManifest.xml"; then

            warn_check "MANAGE_EXTERNAL_STORAGE permission"

          fi

          EXPORTED=$(grep -Rho \
            'android:exported="true"' \
            "$PROJECT" \
            --include="AndroidManifest.xml" \
            | wc -l)

          if [ "$EXPORTED" -gt 0 ]; then
            warn_check "$EXPORTED exported component(s)"
          else
            pass_check "No explicit exported=true components"
          fi

          ICON=$(find "$PROJECT" \
            -type f \
            \( \
              -path "*/mipmap-anydpi-v26/ic_launcher.xml" \
              -o \
              -path "*/mipmap-anydpi-v26/ic_launcher_round.xml" \
            \) \
            | head -1)

          if [ -n "$ICON" ]; then
            pass_check "Adaptive launcher icon"
          else
            warn_check "Adaptive launcher icon not detected"
          fi

          NATIVE=$(find "$PROJECT" \
            -type f \
            -name "*.so" \
            | head -1)

          if [ -z "$NATIVE" ]; then

            pass_check "No bundled native libraries"

          else

            ARM64=$(find "$PROJECT" \
              -type f \
              -path "*arm64-v8a*" \
              -name "*.so" \
              | head -1)

            if [ -n "$ARM64" ]; then
              pass_check "arm64-v8a present"
            else
              block_check "arm64-v8a missing"
            fi

          fi

          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            pass_check "lintRelease passed"
          else
            warn_check "lintRelease

name: Repo2Play V12 Production Engine

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository (owner/repo)"
        required: true
        type: string
      branch:
        description: "Target branch"
        required: true
        default: "main"
        type: string
      build_mode:
        description: "NEW = first release, UPDATE = existing app"
        required: true
        default: "NEW"
        type: choice
        options:
          - NEW
          - UPDATE
      keystore_base64:
        description: "Per-project signing key for UPDATE; blank for NEW"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Analyze Build Sign Package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN || github.token }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run engine
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          BUILD_MODE: ${{ inputs.build_mode }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APP_KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        run: |
          set -euo pipefail
          chmod +x engine/scripts/*.sh
          engine/scripts/run.sh "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/output"

      - name: Require Play Store deliverables
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s output/app-release-signed.apk
          test -s output/app-release-signed.aab
          test -s output/repo2play-upload.jks

      - name: Upload release package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V12-${{ inputs.build_mode }}-Result
          path: output/
          if-no-files-found: error
          retention-days: 7

name: Repo2Play V3

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Android GitHub repository (owner/repo)"
        required: true
        default: "alperen15100/tracear-android"

      branch:
        description: "Branch"
        required: true
        default: "main"

jobs:
  build:
    name: Repo2Play Android Builder
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. Repo2Play
      # ============================================================

      - name: Checkout Repo2Play
        uses: actions/checkout@v4


      # ============================================================
      # 2. Kullanıcının Android reposunu indir
      # Private repo TARGET_REPO_TOKEN ile açılır
      # ============================================================

      - name: Checkout target Android project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}


      # ============================================================
      # 3. Java
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Android projesinin gerçek kök klasörünü bul
      # ============================================================

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          echo "======================================"
          echo "         REPO2PLAY V3"
          echo "======================================"
          echo ""

          echo "Target repository:"
          echo "${{ inputs.repository }}"
          echo ""

          # Önce settings.gradle ara
          SETTINGS=$(find target \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "❌ settings.gradle / settings.gradle.kts bulunamadı"
            echo ""
            echo "Repo içeriği:"
            find target -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "✅ Android/Gradle project bulundu:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. Gradle yöntemini belirle
      #
      # A) gradlew varsa onu kullan
      # B) gradlew yok ama gradle-wrapper.properties varsa
      #    doğru Gradle sürümünü otomatik indir
      # C) ikisi de yoksa sistem Gradle kullan
      # ============================================================

      - name: Prepare Gradle engine
        id: gradle
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd
          echo ""

          # --------------------------------------------------------
          # YÖNTEM 1: gradlew hazır
          # --------------------------------------------------------

          if [ -f "./gradlew" ]; then

            echo "✅ gradlew bulundu"

            chmod +x ./gradlew

            echo "gradle_command=./gradlew" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=wrapper" >> "$GITHUB_OUTPUT"

            ./gradlew --version

            exit 0
          fi


          # --------------------------------------------------------
          # YÖNTEM 2: gradlew yok ama wrapper properties var
          # --------------------------------------------------------

          WRAPPER_PROPERTIES=$(find . \
            -path "*/gradle/wrapper/gradle-wrapper.properties" \
            -type f | head -1)

          if [ -n "$WRAPPER_PROPERTIES" ]; then

            echo "⚠ gradlew yok"
            echo "✅ gradle-wrapper.properties bulundu:"
            echo "$WRAPPER_PROPERTIES"

            DISTRIBUTION_URL=$(grep "^distributionUrl=" \
              "$WRAPPER_PROPERTIES" \
              | cut -d= -f2- \
              | sed 's#\\:#:#g')

            if [ -z "$DISTRIBUTION_URL" ]; then
              echo "❌ Gradle distribution URL bulunamadı"
              exit 1
            fi

            echo ""
            echo "Gradle distribution:"
            echo "$DISTRIBUTION_URL"

            GRADLE_VERSION=$(echo "$DISTRIBUTION_URL" \
              | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')

            if [ -z "$GRADLE_VERSION" ]; then
              echo "❌ Gradle version çözülemedi"
              exit 1
            fi

            echo ""
            echo "Gradle version: $GRADLE_VERSION"

            DOWNLOAD_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            echo ""
            echo "Downloading Gradle..."

            curl -L \
              --retry 3 \
              --fail \
              "$DOWNLOAD_URL" \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            GRADLE_BIN="/tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle"

            chmod +x "$GRADLE_BIN"

            "$GRADLE_BIN" --version

            echo "gradle_command=$GRADLE_BIN" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=downloaded-wrapper-version" >> "$GITHUB_OUTPUT"

            exit 0
          fi


          # --------------------------------------------------------
          # YÖNTEM 3: Wrapper tamamen yok
          # Ubuntu runner'daki Gradle kullan
          # --------------------------------------------------------

          echo "⚠ gradlew yok"
          echo "⚠ gradle-wrapper.properties yok"
          echo ""
          echo "Sistem Gradle deneniyor..."

          if command -v gradle >/dev/null 2>&1; then

            gradle --version

            echo "gradle_command=gradle" >> "$GITHUB_OUTPUT"
            echo "gradle_mode=system" >> "$GITHUB_OUTPUT"

          else

            echo "❌ Kullanılabilir Gradle bulunamadı"
            exit 1

          fi


      # ============================================================
      # 6. Proje analizi
      # ============================================================

      - name: Analyze Play readiness
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          REPORT="$GITHUB_WORKSPACE/REPORT.txt"

          SCORE=0

          echo "Repo2Play V3 Report" > "$REPORT"
          echo "===================" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "Repository: ${{ inputs.repository }}" >> "$REPORT"
          echo "Branch: ${{ inputs.branch }}" >> "$REPORT"
          echo "Project directory: $PROJECT_DIR" >> "$REPORT"
          echo "Gradle mode: ${{ steps.gradle.outputs.gradle_mode }}" >> "$REPORT"

          echo "" >> "$REPORT"


          # --------------------------------------------------------
          # Manifest
          # --------------------------------------------------------

          MANIFEST=$(find "$PROJECT_DIR" \
            -path "*/src/main/AndroidManifest.xml" \
            -type f | head -1)

          if [ -n "$MANIFEST" ]; then

            echo "✅ AndroidManifest"
            echo "✅ AndroidManifest detected" >> "$REPORT"

            SCORE=$((SCORE + 20))

            echo "" >> "$REPORT"
            echo "Permissions:" >> "$REPORT"

            grep -o 'android.permission.[A-Za-z0-9_]*' \
              "$MANIFEST" \
              | sort -u >> "$REPORT" || true

          else

            echo "⚠ AndroidManifest bulunamadı"
            echo "⚠ AndroidManifest not detected" >> "$REPORT"

          fi


          # --------------------------------------------------------
          # Android application plugin
          # --------------------------------------------------------

          if grep -R -q "com.android.application" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts"; then

            echo "✅ Android application plugin"

            echo "✅ Android application plugin" >> "$REPORT"

            SCORE=$((SCORE + 20))

          else

            echo "⚠ Android application plugin bulunamadı"

            echo "⚠ Android application plugin not detected" >> "$REPORT"

          fi


          # --------------------------------------------------------
          # targetSdk
          # --------------------------------------------------------

          TARGET_SDK=$(grep -RhoE \
            'targetSdk(Versi(on)?)?[[:space:]=("]*[0-9]+' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | grep -oE '[0-9]+' \
            | sort -nr \
            | head -1 || true)

          if [ -n "$TARGET_SDK" ]; then

            echo "✅ Target SDK: $TARGET_SDK"
            echo "Target SDK: $TARGET_SDK" >> "$REPORT"

            SCORE=$((SCORE + 20))

          else

            echo "⚠ targetSdk otomatik bulunamadı"
            echo "Target SDK: not detected" >> "$REPORT"

          fi


          # --------------------------------------------------------
          # Debuggable
          # --------------------------------------------------------

          DEBUGGABLE=$(grep -R \
            'android:debuggable="true"' \
            "$PROJECT_DIR" \
            --include="AndroidManifest.xml" \
            | head -1 || true)

          if [ -z "$DEBUGGABLE" ]; then

            echo "✅ debuggable=true yok"
            echo "✅ No explicit debuggable=true" >> "$REPORT"

            SCORE=$((SCORE + 20))

          else

            echo "⚠ debuggable=true bulundu"
            echo "⚠ debuggable=true detected" >> "$REPORT"

          fi


          # --------------------------------------------------------
          # Gradle
          # --------------------------------------------------------

          echo "✅ Gradle engine ready"
          echo "✅ Gradle engine ready" >> "$REPORT"

          SCORE=$((SCORE + 20))


          echo "" >> "$REPORT"

          echo "Initial Play Readiness Score: $SCORE/100" >> "$REPORT"

          echo ""
          echo "======================================"
          echo "Initial Readiness: $SCORE/100"
          echo "======================================"

          echo "READINESS_SCORE=$SCORE" >> "$GITHUB_ENV"


      # ============================================================
      # 7. Gradle task listesini göster
      # ============================================================

      - name: Discover build tasks
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.gradle_command }}"

          echo "Available release tasks:"
          echo ""

          "$GRADLE" tasks --all \
            | grep -Ei \
            "assemble.*release|bundle.*release" \
            | head -100 || true


      # ============================================================
      # 8. APK
      # ============================================================

      - name: Build Release APK
        id: apk
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.gradle_command }}"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          "$GRADLE" assembleRelease --stacktrace


      # ============================================================
      # 9. AAB
      # ============================================================

      - name: Build Release AAB
        id: aab
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          GRADLE="${{ steps.gradle.outputs.gradle_command }}"

          echo "======================================"
          echo "BUILDING AAB"
          echo "======================================"

          "$GRADLE" bundleRelease --stacktrace


      # ============================================================
      # 10. Çıktıları ayıkla
      # ============================================================

      - name: Collect APK and AAB
        shell: bash
        run: |
          mkdir -p repo2play-output

          echo ""
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find target \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/debug/*" \
            -print || true

          find target \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/debug/*" \
            -exec cp {} repo2play-output/ \; || true


          echo ""
          echo "======================================"
          echo "AAB FILES"
          echo "======================================"

          find target \
            -type f \
            -name "*.aab" \
            ! -path "*/intermediates/*" \
            -print || true

          find target \
            -type f \
            -name "*.aab" \
            ! -path "*/intermediates/*" \
            -exec cp {} repo2play-output/ \; || true


          cp REPORT.txt repo2play-output/REPORT.txt


          APK_COUNT=$(find repo2play-output \
            -type f \
            -name "*.apk" | wc -l)

          AAB_COUNT=$(find repo2play-output \
            -type f \
            -name "*.aab" | wc -l)


          {
            echo ""
            echo "Build Results"
            echo "============="
            echo ""
            echo "APK build result: ${{ steps.apk.outcome }}"
            echo "AAB build result: ${{ steps.aab.outcome }}"
            echo ""
            echo "APK files: $APK_COUNT"
            echo "AAB files: $AAB_COUNT"
          } >> repo2play-output/REPORT.txt


          echo ""
          echo "APK count: $APK_COUNT"
          echo "AAB count: $AAB_COUNT"


      # ============================================================
      # 11. Artifact
      # ============================================================

      - name: Upload Repo2Play output
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V3-Output
          path: repo2play-output/
          if-no-files-found: error

name: Repo2Play V12 Store Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed APK + Play Store AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        shell: bash
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_KEYSTORE_BASE64"
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/repo2play-release.jks"
          test -s "$RUNNER_TEMP/repo2play-release.jks"

      - name: Build release APK and AAB
        working-directory: android-app
        env:
          R2P_KEYSTORE_PATH: ${{ runner.temp }}/repo2play-release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify required release files
        run: |
          set -euo pipefail
          test -s android-app/app/build/outputs/apk/release/app-release.apk
          test -s android-app/app/build/outputs/bundle/release/app-release.aab
          mkdir -p store-release
          cp android-app/app/build/outputs/apk/release/app-release.apk store-release/Repo2Play-v12-release.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab store-release/Repo2Play-v12-playstore.aab
          sha256sum store-release/* > store-release/SHA256SUMS.txt

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-V12-Store-Release
          path: store-release/
          if-no-files-found: error
          retention-days: 14
